name: sirket
on:
  schedule:
    - cron: "0 5 * * *"   # UTC 05:00 = İzmir 08:00
  workflow_dispatch:       # elle başlatma düğmesi
permissions:
  contents: write
  models: read
jobs:
  calis:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python sirket.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: |
          git config user.name "sirket-bot"
          git config user.email "sirket-bot@users.noreply.github.com"
          git add raporlar
          git diff --cached --quiet || git commit -m "Günlük rapor"
          git push
